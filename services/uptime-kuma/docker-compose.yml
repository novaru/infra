services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - monitoring
      - forgejo
      - vaultwarden
      - woodpecker

volumes:
  uptime-kuma-data:

networks:
  default:
    name: uptime-kuma_default
  monitoring:
    name: monitoring_default
    external: true
  forgejo:
    name: forgejo_default
    external: true
  vaultwarden:
    name: vaultwarden_default
    external: true
  woodpecker:
    name: woodpecker_default
    external: true
