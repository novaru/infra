services:
  vaultwarden:
    image: vaultwarden/server:1.37.3
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://vault.novaru.cc
      - ADMIN_TOKEN=${VW_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=false
      - WEBSOCKET_ENABLED=true
      - LOG_LEVEL=warn
    volumes:
      - ./vw-data:/data
    ports:
      - "127.0.0.1:8083:80"
    deploy:
      resources:
        limits:
          memory: 150M
